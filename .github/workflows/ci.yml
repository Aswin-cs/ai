name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Verify icon subset font and size limit
        run: |
          npx vitest run tests/icons.spec.ts
          node -e "const sz = require('fs').statSync('app/fonts/material-symbols-subset.woff2').size; console.log('Subset font bytes:', sz); if (sz > 153600) { console.error('Subset font exceeds 150 KB'); process.exit(1); }"

      - name: Run unit and API tests with coverage
        run: npm run test:coverage

      - name: Run component, hook, and accessibility tests with coverage
        run: npm run test:components:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: coverage/

      - name: Build production bundle
        run: npm run build
